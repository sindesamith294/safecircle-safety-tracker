spring.application.name=safecircle-backend
server.port=8080

# Default Dev Profile: H2 in MySQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:safecircledb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console for local inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
safecircle.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
safecircle.jwt.expiration-ms=86400000

# CORS settings
safecircle.cors.allowed-origins=*
